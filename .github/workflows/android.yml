name: Android
on:
  push:
    paths: ['android-part/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-part/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android-part
      - uses: actions/upload-artifact@v4
        with:
          name: LiuLianBot-debug-apk
          path: android-part/app/build/outputs/apk/debug/*.apk
