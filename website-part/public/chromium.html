<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c6ba0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LiuLianBot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LiuLianBot - Chromium</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css?v=20260814-cdp">
</head>
<body>
  <nav id="siteNav" class="navbar" aria-label="Primary"></nav>

  <main class="main-content chromium-page">
    <div class="page-heading">
      <div>
        <h1>Chromium</h1>
        <p>在伺服器端 Chrome 瀏覽器內瀏覽網站。</p>
      </div>
      <button id="chromiumHomeButton" class="btn btn-outline" type="button" title="結束瀏覽工作階段" hidden>結束</button>
    </div>

    <form id="chromiumAddressForm" class="chromium-address-bar" novalidate>
      <label class="sr-only" for="chromiumAddress">網址</label>
      <input id="chromiumAddress" type="url" inputmode="url" autocomplete="url"
        placeholder="輸入網址，例如 https://example.com" required>
      <button class="btn btn-primary" type="submit">前往</button>
    </form>

    <div id="chromiumStatus" class="status-msg" role="status" aria-live="polite">Chromium 已就緒。</div>

    <section id="chromiumHome" class="chromium-home" aria-labelledby="chromiumHomeHeading">
      <h2 id="chromiumHomeHeading">開始瀏覽</h2>
      <p>輸入網址後，系統會建立你的伺服器端 Chromium 工作階段。</p>
      <div class="chromium-quick-links" aria-label="快速連結">
        <a href="https://www.google.com/" data-chromium-url>Google</a>
        <a href="https://github.com/" data-chromium-url>GitHub</a>
        <a href="https://developer.mozilla.org/" data-chromium-url>MDN</a>
      </div>
    </section>

    <section id="chromiumFramePanel" class="chromium-panel" aria-labelledby="chromiumFrameHeading" hidden>
      <div class="chromium-panel-heading">
        <h2 id="chromiumFrameHeading">瀏覽工作區</h2>
        <span id="chromiumConnectionName" class="table-subtext">CDP Screencast</span>
      </div>
      <canvas id="chromiumFrame" class="chromium-frame" role="application" aria-label="Chromium 工作區"></canvas>
    </section>
  </main>

  <script type="module" src="/js/app.mjs"></script>
  <script type="module" src="/js/chromium.mjs?v=20260814-cdp"></script>
</body>
</html>
