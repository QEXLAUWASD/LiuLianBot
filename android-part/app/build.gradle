plugins { id 'com.android.application' }
android {
    namespace 'com.liulianbot.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.liulianbot.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-beta.1'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty "ui.screenshots", layout.buildDirectory.dir("reports/screenshots").get().asFile.path
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('io.socket:socket.io-client:2.1.1') { exclude group: 'org.json', module: 'json' }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
